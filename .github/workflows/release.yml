name: Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build extension
        run: yarn build

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # ── PR: upload zip as a downloadable artifact ──────────────────
      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pro-by-default-v${{ steps.version.outputs.version }}
          path: build/pro-by-default-v${{ steps.version.outputs.version }}.zip

      # ── Master: create a GitHub Release with the zip ───────────────
      - name: Check if tag exists
        if: github.event_name == 'push'
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: github.event_name == 'push' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sticky Model ${{ steps.version.outputs.tag }}
          body: |
            ## Sticky Model ${{ steps.version.outputs.tag }}

            Ready-to-upload extension zip attached below.

            ### Installation
            1. Download the `.zip` file below
            2. Upload it to the Chrome Web Store / Firefox Add-ons developer dashboard
          files: build/pro-by-default-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
