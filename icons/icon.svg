<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="bg-clip">
      <rect x="4" y="4" width="120" height="120" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="#5B4CF0"/>
  <rect x="4" y="4" width="120" height="64" fill="#6C5CF7" clip-path="url(#bg-clip)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- "dumb" - dimmed/faded, left-aligned -->
  <text x="20" y="44" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="23" fill="white" opacity="0.25">dumb</text>

  <!-- "stupid" - dimmed/faded, left-aligned -->
  <text x="20" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="23" fill="white" opacity="0.25">stupid</text>

  <!-- "smart" - bright/selected, left-aligned same as above -->
  <text x="20" y="98" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="25" fill="white" opacity="1">smart</text>

  <!-- Green checkmark circle, vertically centered with "smart" text -->
  <circle cx="104" cy="91" r="13" fill="#22C55E"/>
  <polyline points="97,91 102,96.5 112,85" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
